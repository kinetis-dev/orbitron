<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
  <defs>
    <style>
      @font-face {
        font-family: 'Orbitron';
        font-weight: 900;
        font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2');
      }

      .k-letter {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        fill: none;
        stroke: #DC2626;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .brand-title {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        fill: #F59E0B;
        text-anchor: middle;
        letter-spacing: 0.1em;
      }
      .brand-sub {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        fill: #D97706;
        text-anchor: middle;
        letter-spacing: 0.4em;
      }
    </style>

    <filter id="k-edge-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="text-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="tail-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="ball-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="tail-fade" x1="88.98" y1="-20.87" x2="101.79" y2="-51.23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706" stop-opacity="1" />
      <stop offset="35%" stop-color="#B45309" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#92400E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="tail-fade-2" x1="88.98" y1="-20.87" x2="101.79" y2="-51.23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DB7C0C" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#B85A0F" stop-opacity="0.765" />
      <stop offset="75%" stop-color="#984814" stop-opacity="0.36" />
      <stop offset="100%" stop-color="#803E15" stop-opacity="0.135" />
    </linearGradient>
    <linearGradient id="tail-fade-3" x1="88.98" y1="-20.87" x2="101.79" y2="-51.23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DD8013" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#BD6116" stop-opacity="0.68" />
      <stop offset="75%" stop-color="#9F501A" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#88471B" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="tail-fade-4" x1="88.98" y1="-20.87" x2="101.79" y2="-51.23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DF851A" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#C1681C" stop-opacity="0.595" />
      <stop offset="75%" stop-color="#A65920" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#905021" stop-opacity="0.105" />
    </linearGradient>
    <linearGradient id="tail-fade-5" x1="88.98" y1="-20.87" x2="101.79" y2="-51.23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E18A20" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#C66F22" stop-opacity="0.51" />
      <stop offset="75%" stop-color="#AC6126" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#985827" stop-opacity="0.09" />
    </linearGradient>
    <linearGradient id="tail-fade-6" x1="88.98" y1="-20.87" x2="101.79" y2="-51.23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E38F26" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#CA7629" stop-opacity="0.425" />
      <stop offset="75%" stop-color="#B2692C" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#A1612D" stop-opacity="0.075" />
    </linearGradient>
    <linearGradient id="tail-fade-7" x1="88.98" y1="-20.87" x2="101.79" y2="-51.23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5942D" stop-opacity="0.4" />
      <stop offset="35%" stop-color="#CE7D2F" stop-opacity="0.34" />
      <stop offset="75%" stop-color="#B97132" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#A96A33" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="tail-fade-8" x1="88.98" y1="-20.87" x2="101.79" y2="-51.23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E79834" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#D38435" stop-opacity="0.255" />
      <stop offset="75%" stop-color="#C07938" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#B17339" stop-opacity="0.045" />
    </linearGradient>
    <linearGradient id="tail-fade-9" x1="88.98" y1="-20.87" x2="101.79" y2="-51.23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA9D3A" stop-opacity="0.2" />
      <stop offset="35%" stop-color="#D78B3C" stop-opacity="0.17" />
      <stop offset="75%" stop-color="#C6823E" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#B97C3E" stop-opacity="0.03" />
    </linearGradient>

    <radialGradient id="ball-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FFE9B0" />
    </radialGradient>
  </defs>

  <!-- MARK -->
  <g transform="translate(200, 190)">
    <!-- K monogram, hollow/outline text, crisp with a minimal edge-only glow -->
    <text class="k-letter" x="0" y="6" font-size="150" stroke-width="6" filter="url(#k-edge-glow)">K</text>

    <!-- comet tail: all sections now in front of the K, ordered thickest (back of this group) to thinnest (front) -->
    <path d="M 88.98 -20.87 A 120 48 -35 0 1 52.04 20.17" fill="none" stroke="url(#tail-fade-9)" stroke-width="19" stroke-linecap="round" filter="url(#tail-glow)" />
    <path d="M 88.98 -20.87 A 120 48 -35 0 1 -2.41 57.72" fill="none" stroke="url(#tail-fade-8)" stroke-width="15" stroke-linecap="round" filter="url(#tail-glow)" />
    <path d="M 88.98 -20.87 A 120 48 -35 0 1 -63.34 78.80" fill="none" stroke="url(#tail-fade-7)" stroke-width="11.5" stroke-linecap="round" filter="url(#tail-glow)" />
    <path d="M 88.98 -20.87 A 120 48 -35 0 1 -100.64 64.34" fill="none" stroke="url(#tail-fade-6)" stroke-width="8.5" stroke-linecap="round" filter="url(#tail-glow)" />
    <path d="M 88.98 -20.87 A 120 48 -35 1 1 -87.17 18.19" fill="none" stroke="url(#tail-fade-5)" stroke-width="6" stroke-linecap="round" filter="url(#tail-glow)" />
    <path d="M 88.98 -20.87 A 120 48 -35 1 1 -65.13 -7.92" fill="none" stroke="url(#tail-fade-4)" stroke-width="4.2" stroke-linecap="round" filter="url(#tail-glow)" />

    <path d="M 88.98 -20.87 A 120 48 -35 1 1 -65.13 -7.92" fill="none" stroke="url(#tail-fade-3)" stroke-width="2.8" stroke-linecap="round" filter="url(#tail-glow)" />
    <path d="M -15.35 -47.41 A 120 48 -35 0 1 43.71 -74.83" fill="none" stroke="url(#tail-fade-3)" stroke-width="2.8" stroke-linecap="round" filter="url(#tail-glow)" />

    <path d="M 88.98 -20.87 A 120 48 -35 1 1 -65.13 -7.92" fill="none" stroke="url(#tail-fade-2)" stroke-width="1.7" stroke-linecap="round" filter="url(#tail-glow)" />
    <path d="M -15.35 -47.41 A 120 48 -35 0 1 43.71 -74.83" fill="none" stroke="url(#tail-fade-2)" stroke-width="1.7" stroke-linecap="round" filter="url(#tail-glow)" />

    <path d="M 88.98 -20.87 A 120 48 -35 1 1 -65.13 -7.92" fill="none" stroke="url(#tail-fade)" stroke-width="1.0" stroke-linecap="round" filter="url(#tail-glow)" />
    <path d="M -15.35 -47.41 A 120 48 -35 0 1 43.71 -74.83" fill="none" stroke="url(#tail-fade)" stroke-width="1.0" stroke-linecap="round" filter="url(#tail-glow)" />

    <!-- comet head: dark core, glowing bright rim -->
    <circle cx="88.98" cy="-20.87" r="12" fill="url(#ball-core)" filter="url(#ball-glow)" />
  </g>

  <!-- WORDMARK -->
  <text class="brand-title" x="200" y="350" font-size="66">KINETIS</text>
  <text class="brand-sub" x="200" y="385" font-size="24">FRAMEWORK</text>
</svg>
